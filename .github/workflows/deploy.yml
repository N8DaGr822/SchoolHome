name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/HomeschoolManager.Web/HomeschoolManager.Web.csproj -c Release -o release

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Set base href for project page
        run: sed -i 's|<base href="/" />|<base href="/SchoolHome/" />|' release/wwwroot/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
